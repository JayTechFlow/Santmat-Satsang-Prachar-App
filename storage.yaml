# Sprint E2.2 — Enterprise Storage Configuration
# Environment-aware, feature-flagged, policy-driven storage platform configuration
# Supports: Firebase, AWS S3, Azure Blob, Google Cloud Storage, Cloudflare R2, Local, MinIO, Wasabi, DigitalOcean Spaces

version: "2.0"
environment: "${ENVIRONMENT:-development}"

# ============================================================================
# PROVIDER REGISTRY CONFIGURATION
# ============================================================================
providers:
  - providerId: "firebase-primary"
    providerType: "FIREBASE_STORAGE"
    enabled: true
    priority: 10
    region: "${FIREBASE_STORAGE_REGION:-us-central1}"
    credentials:
      serviceAccountPath: "${FIREBASE_SERVICE_ACCOUNT_PATH}"
      projectId: "${FIREBASE_PROJECT_ID}"
    defaultTier: "hot"
    defaultStorageClass: "STANDARD"
    bucketName: "${FIREBASE_STORAGE_BUCKET:-santmat-media-vault.appspot.com}"
    maxFileSizeBytes: 524288000
    allowedMimeTypes:
      - "image/*"
      - "audio/*"
      - "video/*"
      - "application/pdf"
    blockedMimeTypes:
      - "application/x-executable"
      - "application/x-msdownload"
    versioning: true
    lifecycleRules:
      - id: "archive-old-media"
        enabled: true
        filter:
          prefix: "media/"
        transitions:
          - days: 90
            storageClass: "NEARLINE"
          - days: 365
            storageClass: "COLDLINE"
        abortIncompleteMultipartUpload:
          daysAfterInitiation: 7
    corsRules:
      - allowedOrigins:
          - "https://app.santmat.org"
          - "https://admin.santmat.org"
          - "http://localhost:3000"
          - "http://localhost:8080"
        allowedMethods:
          - "GET"
          - "PUT"
          - "POST"
          - "DELETE"
          - "HEAD"
        allowedHeaders:
          - "*"
        exposeHeaders:
          - "Content-Length"
          - "ETag"
        maxAgeSeconds: 3600
    publicAccessBlock:
      blockPublicAcls: true
      ignorePublicAcls: true
      blockPublicPolicy: true
      restrictPublicBuckets: true

  - providerId: "aws-s3-secondary"
    providerType: "AWS_S3"
    enabled: false
    priority: 20
    region: "${AWS_REGION:-us-east-1}"
    credentials:
      accessKeyId: "${AWS_ACCESS_KEY_ID}"
      secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
      sessionToken: "${AWS_SESSION_TOKEN}"
    defaultTier: "warm"
    defaultStorageClass: "STANDARD_IA"
    bucketName: "${AWS_S3_BUCKET:-santmat-backup}"
    maxFileSizeBytes: 5368709120
    allowedMimeTypes:
      - "*"
    versioning: true
    sseAlgorithm: "AES256"
    kmsKeyId: "${AWS_KMS_KEY_ID}"
    lifecycleRules:
      - id: "cost-optimization"
        enabled: true
        transitions:
          - days: 30
            storageClass: "INTELLIGENT_TIERING"
          - days: 90
            storageClass: "GLACIER"
          - days: 365
            storageClass: "DEEP_ARCHIVE"
        abortIncompleteMultipartUpload:
          daysAfterInitiation: 7

  - providerId: "azure-blob-archive"
    providerType: "AZURE_BLOB"
    enabled: false
    priority: 30
    region: "${AZURE_REGION:-eastus}"
    credentials:
      accountName: "${AZURE_STORAGE_ACCOUNT}"
      accountKey: "${AZURE_STORAGE_KEY}"
      sasToken: "${AZURE_SAS_TOKEN}"
    defaultTier: "cold"
    defaultStorageClass: "COOL"
    bucketName: "${AZURE_CONTAINER:-archive}"
    maxFileSizeBytes: 5368709120
    allowedMimeTypes:
      - "*"
    versioning: true
    lifecycleRules:
      - id: "long-term-archive"
        enabled: true
        transitions:
          - days: 180
            storageClass: "COLD"
          - days: 365
            storageClass: "ARCHIVE"

  - providerId: "gcs-nearline"
    providerType: "GOOGLE_CLOUD_STORAGE"
    enabled: false
    priority: 40
    region: "${GCS_REGION:-us-central1}"
    credentials:
      projectId: "${GCS_PROJECT_ID}"
      clientEmail: "${GCS_CLIENT_EMAIL}"
      privateKey: "${GCS_PRIVATE_KEY}"
    defaultTier: "warm"
    defaultStorageClass: "NEARLINE"
    bucketName: "${GCS_BUCKET:-santmat-nearline}"
    maxFileSizeBytes: 5368709120
    allowedMimeTypes:
      - "*"
    versioning: true

  - providerId: "cloudflare-r2-cdn"
    providerType: "CLOUDFLARE_R2"
    enabled: false
    priority: 5
    region: "auto"
    credentials:
      accountId: "${CF_R2_ACCOUNT_ID}"
      accessKeyId: "${CF_R2_ACCESS_KEY_ID}"
      secretAccessKey: "${CF_R2_SECRET_ACCESS_KEY}"
    defaultTier: "hot"
    defaultStorageClass: "STANDARD"
    bucketName: "${CF_R2_BUCKET:-santmat-cdn}"
    maxFileSizeBytes: 5368709120
    allowedMimeTypes:
      - "image/*"
      - "video/*"
      - "audio/*"
    endpoint: "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
    forcePathStyle: true
    versioning: true

  - providerId: "local-development"
    providerType: "LOCAL"
    enabled: true
    priority: 100
    region: "local"
    credentials: {}
    defaultTier: "hot"
    defaultStorageClass: "STANDARD"
    bucketName: "local-storage"
    config:
      baseDirectory: "./storage/local"
      publicUrlPrefix: "http://localhost:9000"
      enableSymbolicLinks: false
    maxFileSizeBytes: 1073741824
    allowedMimeTypes:
      - "*"

# ============================================================================
# ROUTING CONFIGURATION
# ============================================================================
routing:
  defaultStrategy: "content_type_routing"
  enabledStrategies:
    - "content_type_routing"
    - "health_based_routing"
    - "failover_routing"
    - "primary_secondary"
    - "capability_routing"
    - "tier_based_routing"
  strategyConfig:
    content_type_routing:
      enabled: true
      rules:
        - mimeTypePrefix: "video/"
          providerIds: ["firebase-primary", "cloudflare-r2-cdn"]
          tier: "hot"
          requireCapabilities: ["streaming", "multipartUpload"]
        - mimeTypePrefix: "audio/"
          providerIds: ["firebase-primary"]
          tier: "hot"
          requireCapabilities: ["streaming"]
        - mimeTypePrefix: "image/"
          providerIds: ["firebase-primary", "cloudflare-r2-cdn"]
          tier: "hot"
          requireCapabilities: ["signedUrls"]
        - mimeTypePrefix: "application/pdf"
          providerIds: ["firebase-primary"]
          tier: "warm"
    health_based_routing:
      enabled: true
      healthThreshold: "degraded"
      fallbackStrategy: "failover_routing"
      excludeOffline: true
    failover_routing:
      enabled: true
      primaryProviderId: "firebase-primary"
      secondaryProviderIds: ["aws-s3-secondary", "azure-blob-archive", "local-development"]
      healthCheckIntervalSeconds: 30
      failbackEnabled: true
      failbackDelaySeconds: 300
    primary_secondary:
      enabled: true
      primaryProviderId: "firebase-primary"
      secondaryProviderIds: ["aws-s3-secondary"]
      asyncReplication: true
      replicationDelayMs: 100
    round_robin:
      enabled: false
      providerIds: []
    tier_based_routing:
      enabled: true
      tierMapping:
        hot: ["firebase-primary", "cloudflare-r2-cdn"]
        warm: ["firebase-primary", "aws-s3-secondary", "gcs-nearline"]
        cold: ["azure-blob-archive", "gcs-nearline"]
        archive: ["azure-blob-archive"]
    capability_routing:
      enabled: true
      capabilityPriorities:
        streaming: ["firebase-primary", "cloudflare-r2-cdn"]
        multipartUpload: ["firebase-primary", "aws-s3-secondary"]
        versioning: ["firebase-primary", "aws-s3-secondary", "azure-blob-archive"]
        retention: ["aws-s3-secondary", "azure-blob-archive", "gcs-nearline"]
        legalHold: ["aws-s3-secondary", "azure-blob-archive"]
    cost_aware_routing:
      enabled: false
      maxCostPerGBMonth: 0.03
      preferCheapest: true
    geo_routing:
      enabled: false
      regionMapping: {}
      defaultRegion: "us-central1"

# ============================================================================
# FEATURE FLAGS
# ============================================================================
features:
  multipartUpload: true
  resumableUpload: true
  versioning: true
  legalHold: true
  retention: true
  batchOperations: false
  costReporting: false
  replication: true
  backup: true
  encryption:
    enabled: true
    defaultAlgorithm: "AES-256-GCM"
    kmsKeyId: "${KMS_KEY_ID}"
  compression:
    enabled: false
    algorithms: ["gzip", "zstd"]
  deduplication:
    enabled: false
  cdn:
    enabled: false
    providerId: "cloudflare-r2-cdn"
  observability:
    tracing: true
    metrics: true
    logging: true

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
security:
  encryptionAlgorithm: "AES-256-GCM"
  kmsKeyId: "${KMS_KEY_ID}"
  executableBlock: true
  pathConstraints: true
  overwriteProtection: true
  signedTokenValidation: true
  checksumValidation: true
  checksumAlgorithm: "SHA256"
  maxFileSizeBytes: 524288000
  virusScan:
    enabled: false
    engine: "clamav"
    maxFileSizeBytes: 104857600
  contentValidation:
    enabled: true
    magicBytesCheck: true
    mimeTypeVerification: true
  accessControl:
    defaultPublicRead: false
    requireSignedUrls: true
    signedUrlMaxExpirySeconds: 86400
  auditLogging:
    enabled: true
    logUploads: true
    logDownloads: true
    logDeletes: true
    logMetadataChanges: true

# ============================================================================
# LIFECYCLE DEFAULTS
# ============================================================================
lifecycle:
  defaultRetentionDays: 2555
  hotToWarmDays: 90
  warmToColdDays: 180
  coldToArchiveDays: 365
  autoTiering:
    enabled: true
    evaluationIntervalHours: 24
  expiration:
    enabled: false
    defaultDays: 3650
  multipartAbort:
    enabled: true
    daysAfterInitiation: 7

# ============================================================================
# BACKUP CONFIGURATION
# ============================================================================
backup:
  enabled: true
  schedule: "0 2 * * *"
  timezone: "UTC"
  retentionDays: 90
  sourceProviderIds:
    - "firebase-primary"
  destinationProviderId: "aws-s3-secondary"
  includeVersions: true
  filter:
    prefix: "media/"
    tags:
      backup: "required"
  compression: true
  encryption: true
  verification:
    enabled: true
    sampleRate: 0.1

# ============================================================================
# REPLICATION CONFIGURATION
# ============================================================================
replication:
  enabled: true
  mode: "async"
  sourceProviderId: "firebase-primary"
  destinationProviderIds:
    - "aws-s3-secondary"
  filter:
    prefix: "media/"
  deleteMarkerReplication: true
  replicationTimeControlMinutes: 15
  consistencyVerification:
    enabled: true
    intervalHours: 6
    sampleRate: 0.05

# ============================================================================
# OBSERVABILITY
# ============================================================================
observability:
  healthCheckIntervalSeconds: 60
  metricsEnabled: true
  tracingEnabled: true
  logLevel: "info"
  metricsPort: 9090
  healthEndpoint: "/health/storage"
  alerting:
    enabled: false
    latencyThresholdMs: 5000
    errorRateThreshold: 0.05
    capacityThresholdPercent: 80
  exporters:
    prometheus:
      enabled: true
      path: "/metrics"
    datadog:
      enabled: false
    newrelic:
      enabled: false

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================
performance:
  connectionPool:
    minSize: 5
    maxSize: 50
    idleTimeoutMs: 30000
  concurrency:
    maxParallelUploads: 10
    maxParallelDownloads: 20
    maxParallelOperations: 50
  timeouts:
    connectMs: 5000
    readMs: 30000
    writeMs: 60000
  retry:
    maxAttempts: 3
    baseDelayMs: 200
    maxDelayMs: 5000
    backoffMultiplier: 2
  buffering:
    uploadBufferSize: 8388608
    downloadBufferSize: 8388608
  caching:
    metadataCacheTtlSeconds: 300
    signedUrlCacheTtlSeconds: 300
    healthCacheTtlSeconds: 30