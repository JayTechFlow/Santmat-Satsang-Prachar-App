name: santmat_satsang_prachar
description: "Santmat Satsang Prachar — Android mobile app."
publish_to: 'none'

# versionName = 1.0.0, versionCode = 1
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.2
  firebase_core: ^4.12.1
  logger: ^2.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.3.1
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  firebase_remote_config: ^6.5.5
  cloud_functions: ^6.3.5
  firebase_app_check: ^0.4.5+2
  path_provider: ^2.1.5
  crypto: ^3.0.7
  cached_network_image: ^3.4.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  share_plus: ^12.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.2.2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Recommended lint set, activated in analysis_options.yaml.
  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  # Generate lib/l10n/gen/app_localizations*.dart from lib/l10n/*.arb
  generate: true

  # Includes the Material Icons font.
  uses-material-design: true
